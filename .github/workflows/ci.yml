name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://prisma:prisma@localhost:5432/prisma
        run: pnpm --filter @delivery/db generate

      - name: Lint
        run: pnpm lint

      - name: "Build (topological: shared, db, then apps)"
        run: pnpm -r build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test
